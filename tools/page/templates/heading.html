<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="size" content="1600x150">
<link rel="stylesheet" href="../base.css">
<style>:root{--w:1600px;--h:150px}body{background:transparent}
.pill{position:absolute;left:500px;top:24px;width:600px;height:102px;border-radius:51px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.a{font:600 38px/1.25 Cairo;color:var(--ivory)}.e{font:600 19px/1.2 Cairo;color:#9fe0bd}
.l,.r{position:absolute;top:74px;height:3px;border-radius:3px}
.l{left:60px;width:420px;background:linear-gradient(90deg,transparent,var(--crimson))}
.r{right:60px;width:420px;background:linear-gradient(90deg,var(--emerald),transparent)}
.d{position:absolute;top:69px;width:13px;height:13px;border-radius:50%}
</style></head><body>
<div class="l"></div><div class="r"></div>
<div class="d" style="left:474px;background:var(--crimson);box-shadow:0 0 14px var(--crimson)"></div>
<div class="d" style="right:474px;background:var(--emerald);box-shadow:0 0 14px var(--emerald)"></div>
<div class="pill glass"><div class="a ar" id="a"></div><div class="e" id="e"></div></div>
<script>const q=new URLSearchParams(location.search);a.textContent=q.get('ar');e.textContent=q.get('en');</script>
</body></html>
