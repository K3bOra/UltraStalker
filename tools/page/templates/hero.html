<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1600x820">
<link rel="stylesheet" href="../base.css">
<style>:root{--w:1600px;--h:820px}
.text{position:absolute;left:96px;top:0;bottom:0;width:560px;display:flex;flex-direction:column;justify-content:center}
.t1{font:600 118px/1 Cairo;color:var(--ivory);letter-spacing:2px}
.t2{font:600 118px/1.05 Cairo;color:var(--green);letter-spacing:2px}
.ar1{font:600 46px/1.5 Cairo;color:var(--rose);margin-top:6px}
.line{height:3px;width:260px;border-radius:3px;background:linear-gradient(90deg,var(--crimson),var(--emerald));margin:20px 0 22px}
.en{font:600 30px/1.4 Cairo;color:var(--ivory)}
.arl{font:600 27px/1.6 Cairo;color:var(--soft);margin-top:4px;text-align:left}
.chips{display:flex;gap:12px;margin-top:30px}
.chips span{font:600 21px/1 Cairo;color:var(--ivory);padding:12px 22px;border-radius:999px;background:rgba(20,40,34,.7);box-shadow:inset 0 0 0 1.5px rgba(100,214,159,.55)}
.chips span:first-child{box-shadow:inset 0 0 0 1.5px rgba(212,82,99,.65);background:rgba(50,18,26,.7)}
.shot{position:absolute;border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(90deg,var(--crimson),rgba(80,90,90,.5) 50%,var(--emerald));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.back{left:830px;top:70px;width:640px;height:360px;transform:rotate(-3deg);opacity:.75;filter:saturate(.85) brightness(.8)}
.front{left:700px;top:200px;width:780px;height:439px}
.mini{left:1180px;top:520px;width:340px;height:191px;transform:rotate(2deg)}
</style></head><body>
<div class="ground"></div>
<div class="shot back"><img src="../../../docs/screenshots/16_series_grid_v3.jpg"></div>
<div class="shot front"><img src="../../../docs/screenshots/02_home_cinematic.jpg"></div>
<div class="shot mini"><img src="../../../docs/screenshots/20_player.jpg"></div>
<div class="text">
  <div class="t1">ULTRA</div><div class="t2">STALKER</div>
  <div class="ar1 ar" style="text-align:left">الترا ستالكر</div>
  <div class="line"></div>
  <div class="en">Your media. Beautifully connected.</div>
  <div class="arl ar">محتواك المفضل… في تجربة واحدة متكاملة</div>
  <div class="chips"><span>Live TV</span><span>Movies</span><span>Series</span><span>Local</span></div>
</div>
<div class="edge"></div>
</body></html>
