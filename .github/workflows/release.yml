name: Publish verified Ultra Stalker release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ultrastalker-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install artwork regression dependency
        run: python3 -m pip install 'Pillow==11.3.0'
      - name: Validate both packages and poster-cache regressions
        run: |
          python3 -B scripts/prepare_release.py
          python3 -B scripts/test_blue_cache.py
      - name: Upload draft, download and verify, then publish
        shell: bash
        run: |
          set -euo pipefail
          release_tag=$(python3 -c 'import json; print(json.load(open("dist/release-info.json"))["tag"])')
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This version already exists. Increment the package version; release assets are never overwritten.'
            exit 1
          fi
          release_title=$(python3 -c 'import json; print(json.load(open("dist/release-info.json"))["title"])')
          gh release create "$release_tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$release_title" --notes-file dist/notes.md dist/*.ipk dist/*.deb dist/update*.json dist/RELEASE_NOTES.md dist/SHA256SUMS dist/install.sh
          gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern '*.ipk' --pattern '*.deb' --pattern 'update*.json' --pattern RELEASE_NOTES.md --pattern install.sh --pattern SHA256SUMS --dir verified
          python3 scripts/prepare_release.py --verify-published verified
          gh release edit "$release_tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
      - name: Verify both public package downloads
        run: |
          sh install.sh --verify-only
          python3 -B scripts/prepare_release.py --verify-public
      - name: Refresh independent platform update manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import base64, json, os, subprocess
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']
          for name in ('update.json','update-ipk.json','update-dreamos-py2.json','update-dreamos.json'):
              endpoint='repos/%s/contents/%s'%(repo,name)
              previous=subprocess.run(['gh','api',endpoint],stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              if previous.returncode:
                  if b'(HTTP 404)' not in previous.stderr:raise RuntimeError(previous.stderr.decode('utf-8','replace'))
                  prior={}
              else:
                  prior=json.loads(previous.stdout)
              body={'message':'Refresh verified '+name,'branch':'main',
                    'content':base64.b64encode(Path('dist',name).read_bytes()).decode('ascii')}
              if prior.get('sha'):body['sha']=prior['sha']
              request=Path('dist/update-request.json');request.write_text(json.dumps(body))
              subprocess.run(['gh','api','--method','PUT',endpoint,'--input',str(request)],check=True)
          PYCODE
